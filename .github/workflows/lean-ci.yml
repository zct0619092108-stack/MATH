name: Public Lean + Mathlib CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean via lean-action
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Resolve pinned dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build public test module
        run: lake build MathVerification

      - name: Display theorem axioms
        run: lake env lean MathVerification.lean
